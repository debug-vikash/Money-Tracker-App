# Application Name
spring.application.name=Money-Tracker-App

# Server Configuration
server.port=3000

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/moneytracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=TW9uZXlUcmFja2VyU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb24yMDI0VmVyeUxvbmdTZWNyZXRLZXk=
app.jwt.expiration=86400000

# File Export Path
app.export.path=./exports

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# Logging
logging.level.com.moneytracker=DEBUG
logging.level.org.springframework.security=DEBUG
